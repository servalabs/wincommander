[package]
name = "wci-verify"
version = "1.0.0"
description = "WinCommander Investigator — standalone case-bundle verifier"
authors = ["ServaLabs"]
license = "AGPL-3.0-or-later"
edition = "2021"

[[bin]]
name = "wci-verify"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
