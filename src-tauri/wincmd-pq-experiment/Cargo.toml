[package]
name = "wincmd-pq-experiment"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[features]
experimental-signer = ["dep:sha2", "dep:hex"]
experimental-offline-verifier = ["dep:sha2", "dep:hex"]

[dependencies]
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "aws-lc-sys"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }

[[bin]]
name = "wincmd-pq-release-check"
path = "src/bin/release_check.rs"
required-features = ["experimental-offline-verifier"]
