[package]
name = "fleet-agent-core"
version = "0.1.0"
description = "Generic fleet-client loop (enroll/check-in/verify/dispatch) shared by TuxCommander, WinCommander Pro, and future fleet-managed agents"
authors = ["ServaLabs"]
license = "AGPL-3.0-or-later"
edition = "2021"

# The verify/crypto path must build under `--no-default-features --features types`
# with ZERO reqwest/tokio in the dependency closure — this is the Free-safe slice
# that lets a types-only consumer (e.g. WinCommander Free) verify locally without
# linking the transport loop. See [features] below.
[dependencies]
fleet-proto = { path = "../fleet-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "signature", "rand_core"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
anyhow = "1"
tracing = "0.1"

# Transport-only deps — gated behind the `transport` feature so the `types`
# slice never pulls them in.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
tokio = { version = "1", features = ["time", "rt", "sync", "macros"], optional = true }
# TLS SPKI-hash pinning (optional, config-driven — see pinning.rs). Versions
# pinned to match what reqwest's own `rustls` feature already resolves in
# this workspace (rustls 0.23.x / aws-lc-rs backend / rustls-webpki 0.103.x)
# so pinning never drags in a second copy of the rustls stack.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "logging", "tls12"], optional = true }
rustls-webpki = { version = "0.103", default-features = false, features = ["aws-lc-rs", "std"], optional = true }

[dev-dependencies]
serial_test = "4"
rcgen = "0.14"

[features]
default = ["transport"]
# Types-only slice: re-exports fleet-proto + the pure verify/crypto path.
# NO reqwest, NO tokio. This is what a Free-tier binary should link if it
# only needs to verify signed commands locally.
types = []
# The full background check-in loop (enroll/check-in/backoff/dispatch).
transport = ["dep:reqwest", "dep:tokio", "dep:rustls", "dep:rustls-webpki"]
