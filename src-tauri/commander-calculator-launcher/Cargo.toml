[package]
name = "commander-calculator-launcher"
version = "3.6.6"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Protected asInvoker launcher for WinCommander Calculator Lock"
build = "build.rs"

[[bin]]
name = "Calculator"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"
