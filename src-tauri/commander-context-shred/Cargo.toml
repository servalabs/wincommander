[package]
name = "commander-context-shred"
version = "3.5.1"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Silent asInvoker Explorer context-menu secure erase helper"
build = "build.rs"

[[bin]]
name = "wincommander-context-shred"
path = "src/main.rs"
test = false

[lib]
name = "commander_context_shred"
path = "src/lib.rs"

[dependencies]
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"
