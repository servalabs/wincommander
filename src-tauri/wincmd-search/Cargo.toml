[package]
name = "wincmd-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"
license = "AGPL-3.0-or-later"
description = "Full-text file-content search for WinCommander (Free tier)"

[dependencies]
tantivy       = "0.26"
lopdf         = "0.44"   # >=0.42 fixes RUSTSEC-2026-0187 (stack overflow on nested PDFs)
calamine      = "0.36.1"
quick-xml     = "0.41"   # >=0.42 fixes RUSTSEC-2026-0194/0195 (OOXML DoS)
globset       = "0.4"
zip           = "4.6"
notify        = "8"
once_cell     = "1"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
thiserror     = "2"
sha2          = "0.10"

[dev-dependencies]
tempfile = "3"
# Same versions as [dependencies] above so the integration harness can
# synthesize real docx/pptx/xlsx (zip) and pdf (lopdf) fixtures without
# pulling any new crate into the lock. Dev-deps never link into the shipped
# AV-clean Free binary.
zip   = "4.6"
lopdf = "0.44"
