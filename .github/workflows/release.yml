name: release

# A protected version tag is the only release trigger. The job pauses at the
# protected `release` environment before GitHub exposes the Tauri signing key.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: public-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # publish GitHub Release assets
  id-token: write # keyless Sigstore provenance
  attestations: write # persist build provenance

jobs:
  build-free-release:
    name: Build, sign, publish, and attest Free MSI
    runs-on: windows-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Checkout required Risk Matrix source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: servalabs/assets
          ref: ff5e7829981b5ace5e9de0658b9ad9404d808064
          path: assets
          sparse-checkout: |
            components/risk-matrix
            entities
            editorial
            softwares

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Build signed Free MSI
        env:
          RUST_MIN_STACK: "16777216"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --config src-tauri/commander-free/tauri.conf.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: wincommander-free.sbom.cdx.json

      - name: Prepare signed release assets
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if (-not $env:RELEASE_TAG.StartsWith("v")) {
            throw "Release tags must start with 'v': $env:RELEASE_TAG"
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $config = Get-Content "src-tauri/commander-free/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($config.version -ne $version) {
            throw "Tag $env:RELEASE_TAG does not match Tauri version $($config.version)."
          }

          $msis = @(Get-ChildItem "src-tauri/target/release/bundle" -Filter "WinCommander*${version}*_x64_en-US.msi" -Recurse | Where-Object { $_.Name -notlike "*.sig*" })
          if ($msis.Count -ne 1) {
            throw "Expected exactly one MSI for v$version; found $($msis.Count)."
          }
          $msi = $msis[0]
          $signaturePath = "$($msi.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Tauri updater signature not found: $signaturePath"
          }

          $signature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Tauri updater signature is empty."
          }
          $signatureText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($signature))
          if ($signatureText -notmatch [Regex]::Escape($msi.Name)) {
            throw "The updater signature does not name $($msi.Name)."
          }

          $assetDirectory = Join-Path $env:RUNNER_TEMP "wincommander-release-assets"
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
          $manifestPath = Join-Path $assetDirectory "latest.json"
          $checksumPath = Join-Path $assetDirectory "SHA256SUMS.txt"
          $assetName = [Uri]::EscapeDataString($msi.Name)
          $manifest = @{
            version = $version
            notes = "WinCommander Free v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText($manifestPath, $manifest, [Text.UTF8Encoding]::new($false))

          $sha256 = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($checksumPath, "$sha256 *$($msi.Name)`n", [Text.UTF8Encoding]::new($false))

          "MSI_PATH=$($msi.FullName)" | Add-Content -Path $env:GITHUB_ENV
          "MSI_SIGNATURE_PATH=$signaturePath" | Add-Content -Path $env:GITHUB_ENV
          "LATEST_JSON_PATH=$manifestPath" | Add-Content -Path $env:GITHUB_ENV
          "CHECKSUM_PATH=$checksumPath" | Add-Content -Path $env:GITHUB_ENV

      - name: Attest signed MSI provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.MSI_PATH }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wincommander-free-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.MSI_PATH }}
            ${{ env.MSI_SIGNATURE_PATH }}
            ${{ env.LATEST_JSON_PATH }}
            ${{ env.CHECKSUM_PATH }}
            wincommander-free.sbom.cdx.json
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $releaseAssets = @(
            $env:MSI_PATH,
            $env:MSI_SIGNATURE_PATH,
            $env:LATEST_JSON_PATH,
            $env:CHECKSUM_PATH,
            "wincommander-free.sbom.cdx.json"
          )
          $notes = "Automated Free MSI release. Verify provenance with: gh attestation verify `"<installer>.msi`" -R ${{ github.repository }}"

          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @releaseAssets --clobber
            exit $LASTEXITCODE
          }

          $releaseArgs = @("release", "create", $env:RELEASE_TAG, "--title", $env:RELEASE_TAG, "--notes", $notes)
          if ($env:RELEASE_TAG.Contains("-")) {
            $releaseArgs += "--prerelease"
          }
          $releaseArgs += $releaseAssets
          gh @releaseArgs
