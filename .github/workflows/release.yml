name: release

# A vX.Y.Z tag starts the release. Pushing the tag (locally or after a
# prepare-release PR merges) validates the already-aligned versions, then the NSIS setup
# job uses the protected `release` environment (signing key + R2).
# An authorized maintainer may start the workflow, but publication always waits
# for a different required reviewer to approve the protected environment.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: public-release
  cancel-in-progress: false

permissions: {}

jobs:
  verify-release-controls:
    name: Verify independent release controls
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require protected main and independently reviewed environment
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          if ! branch_rules="$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main")"; then
            echo "::error::Cannot verify the effective rules for main. Configure an active repository ruleset that requires pull requests and at least one approval, and ensure RELEASE_AUTOMATION_TOKEN can read repository rules." >&2
            exit 1
          fi
          if ! release_environment="$(gh api "repos/${GITHUB_REPOSITORY}/environments/release")"; then
            echo "::error::Cannot verify the Release environment. Create it with required reviewers, or ensure RELEASE_AUTOMATION_TOKEN can read environment settings." >&2
            exit 1
          fi
          tag_rulesets=""
          if ! tag_ruleset_ids="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" --paginate --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id')"; then
            echo "::error::Cannot list active tag rulesets." >&2
            exit 1
          fi
          while IFS= read -r ruleset_id; do
            [[ -z "${ruleset_id}" ]] && continue
            if ! ruleset="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}")"; then
              echo "::error::Cannot inspect tag ruleset ${ruleset_id}." >&2
              exit 1
            fi
            tag_rulesets+="${ruleset}"$'\n'
          done <<< "${tag_ruleset_ids}"

          BRANCH_RULES_JSON="${branch_rules}" RELEASE_ENVIRONMENT_JSON="${release_environment}" TAG_RULESETS_JSON_LINES="${tag_rulesets}" node <<'NODE'
          // RELEASE_CONTROL_EVALUATOR
          const branchRules = JSON.parse(process.env.BRANCH_RULES_JSON || "null");
          const releaseEnvironment = JSON.parse(process.env.RELEASE_ENVIRONMENT_JSON || "null");
          const tagRulesets = (process.env.TAG_RULESETS_JSON_LINES || "").split("\n").filter(Boolean).map((line) => JSON.parse(line));
          const reviewedMain = Array.isArray(branchRules) && branchRules.some((rule) => rule.type === "pull_request" &&
            Number(rule.parameters?.required_approving_review_count || 0) >= 1 &&
            (rule.parameters?.dismiss_stale_reviews_on_push === true || rule.parameters?.require_last_push_approval === true));
          if (!reviewedMain) throw new Error("Release blocked: main review protection is incomplete.");
          const reviewerRules = (releaseEnvironment?.protection_rules || []).filter((rule) => rule.type === "required_reviewers");
          if (!reviewerRules.some((rule) => rule.reviewers?.length >= 1 && rule.prevent_self_review === true) || releaseEnvironment?.can_admins_bypass !== false) {
            throw new Error("Release blocked: Release environment protection is incomplete.");
          }
          const protectedTags = tagRulesets.some((ruleset) => {
            const includes = ruleset.conditions?.ref_name?.include || [];
            const excludes = ruleset.conditions?.ref_name?.exclude || [];
            const ruleTypes = new Set((ruleset.rules || []).map((rule) => rule.type));
            return ruleset.target === "tag" && ruleset.enforcement === "active" && includes.includes("refs/tags/v*") &&
              excludes.length === 0 && ["creation", "deletion", "update"].every((type) => ruleTypes.has(type)) &&
              ruleset.current_user_can_bypass === "always";
          });
          if (!protectedTags) throw new Error("Release blocked: protected v* tag creation is not configured for this automation identity.");
          NODE

          echo "Release controls verified: reviewed main, independently approved publication, and protected v* tags."

  align-version:
    name: Validate release source and versions
    needs: verify-release-controls
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.align.outputs.release_sha }}
    steps:
      - name: Require owner, admin, or allowlisted releaser
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          RELEASE_AUTO_APPROVERS: ${{ vars.RELEASE_AUTO_APPROVERS }}
        run: |
          set -euo pipefail
          perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)"
          actor_lc="$(printf '%s' "${ACTOR}" | tr '[:upper:]' '[:lower:]')"
          listed=false
          allow="$(printf '%s' "${RELEASE_AUTO_APPROVERS:-}" | tr ',;' ' ')"
          for name in ${allow}; do
            name_lc="$(printf '%s' "${name}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${actor_lc}" == "${name_lc}" ]]; then
              listed=true
            fi
          done
          echo "Release requested by ${ACTOR} (${perm}, allowlisted=${listed})"
          if [[ "${perm}" != "admin" && "${listed}" != "true" ]]; then
            echo "Only repository owners/admins or people in RELEASE_AUTO_APPROVERS can start a release." >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Require reviewed main source aligned with the tag
        id: align
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like vX.Y.Z or vX.Y.Z-prerelease: ${RELEASE_TAG}" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          git fetch origin main --quiet
          tag_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${tag_sha}" origin/main; then
            echo "::error::Release blocked: ${RELEASE_TAG} is not part of protected main. Prepare and merge the release PR before creating its tag." >&2
            exit 1
          fi

          main_version="$(git show origin/main:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if ! published_tags="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.draft == false) | .tag_name')"; then
            echo "::error::Cannot verify published release versions." >&2
            exit 1
          fi
          if [[ -z "${published_tags}" ]]; then
            echo "::error::No published release baseline was found; bootstrap releases require a separately reviewed process." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} is already published; replay and asset overwrite are blocked." >&2
            exit 1
          fi

          MAIN_VERSION="${main_version}" PUBLISHED_TAGS_LINES="${published_tags}" node <<'NODE'
          const fs = require('fs');
          const version = process.env.RELEASE_TAG.slice(1);
          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const current = packageJson.version;
          const parse = (value) => {
            const match = /^(?:v)?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(value);
            if (!match) throw new Error(`Invalid version: ${value}`);
            return { core: match.slice(1, 4).map(Number), pre: match[4]?.split(".") || [] };
          };
          const compare = (left, right) => {
            const a = parse(left), b = parse(right);
            for (let i = 0; i < 3; i++) if (a.core[i] !== b.core[i]) return a.core[i] - b.core[i];
            if (!a.pre.length || !b.pre.length) return a.pre.length ? -1 : b.pre.length ? 1 : 0;
            for (let i = 0; i < Math.max(a.pre.length, b.pre.length); i++) {
              if (a.pre[i] === undefined) return -1;
              if (b.pre[i] === undefined) return 1;
              if (a.pre[i] === b.pre[i]) continue;
              const an = /^\d+$/.test(a.pre[i]), bn = /^\d+$/.test(b.pre[i]);
              if (an && bn) return Number(a.pre[i]) - Number(b.pre[i]);
              if (an !== bn) return an ? -1 : 1;
              return a.pre[i].localeCompare(b.pre[i]);
            }
            return 0;
          };
          if (version !== process.env.MAIN_VERSION) throw new Error(`Tag v${version} is not current protected-main version ${process.env.MAIN_VERSION}.`);
          const publishedTags = (process.env.PUBLISHED_TAGS_LINES || "").split("\n").filter(Boolean);
          if (!publishedTags.length || publishedTags.some((tag) => compare(version, tag) <= 0)) {
            throw new Error(`Tag v${version} must be newer than every published release; rollback or replay requires a separate reviewed process.`);
          }

          const tauriPath = 'src-tauri/commander-free/tauri.conf.json';
          const cargoPath = 'src-tauri/commander-free/Cargo.toml';
          const lockPath = 'src-tauri/Cargo.lock';
          const tauriConfig = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          const cargo = fs.readFileSync(cargoPath, 'utf8');
          const lock = fs.readFileSync(lockPath, 'utf8');
          const cargoVersion = (cargo.match(/^version = "([^"]+)"/m) || [])[1];
          const lockVersion = (lock.match(/\[\[package\]\]\nname = "commander-free"\nversion = "([^"]+)"/) || [])[1];
          const aligned =
            current === version &&
            tauriConfig.version === version &&
            cargoVersion === version &&
            lockVersion === version;
          if (!aligned) {
            throw new Error(`Release tag v${version} is not version-aligned. Run prepare release and merge its reviewed PR; this workflow never writes to main.`);
          }
          console.log(`Version files match ${version}.`);

          NODE

          echo "release_sha=${tag_sha}" >> "$GITHUB_OUTPUT"

  build-free-release:
    name: Build, sign, publish to R2 and GitHub, and attest Free setup
    needs: align-version
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment:
      name: release
      url: https://winupdates.servalabs.com/free/latest.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.align-version.outputs.release_sha }}
          # Build from the exact reviewed and version-aligned tag commit.
          # A hard-coded assets ref can drift from local development and ship
          # a release with missing runtime logos despite a passing dev build.
          submodules: recursive

      - name: Validate pinned shared build assets
        shell: pwsh
        run: |
          $checkedOutAssets = Join-Path $env:GITHUB_WORKSPACE "assets"
          $required = @(
            "apps/adguard-home.svg",
            "apps/android.png",
            "components/risk-matrix/index.ts",
            "entities/rsa-logo.svg",
            "editorial/nsa-prism-slide.png",
            "products/contingency/usb-decoy-hub.png",
            "products/private-server/pro-nobg.png",
            "products/private-server/max-nobg.png",
            "products/private-server/contingency/panic-button.webm",
            "products/private-server/contingency/panic-button.mp4",
            "products/private-server/contingency/watering-plant.webm",
            "products/private-server/contingency/watering-plant.mp4",
            "products/private-server/contingency/phone-click.webm",
            "products/private-server/contingency/phone-click.mp4",
            "products/wincommander/logo.png",
            "products/wincommander/Scrub.gif",
            "products/wincommander/Extention.png",
            "products/wincommander/videos/wc-lockdown.mp4",
            "softwares/firefox.svg",
            "softwares/glasswire.png",
            "softwares/lightburn.png",
            "softwares/coreldraw.png",
            "softwares/autodesk.png"
          )

          foreach ($relativePath in $required) {
            $path = Join-Path $checkedOutAssets $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Pinned shared asset is missing: $relativePath"
            }
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Normalize and validate updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          if ([string]::IsNullOrWhiteSpace($key)) {
            throw "The release environment does not provide TAURI_SIGNING_PRIVATE_KEY."
          }

          try {
            $decodedKey = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
          } catch [FormatException] {
            if ($key -notmatch '^untrusted comment:') {
              throw "TAURI_SIGNING_PRIVATE_KEY must be an outer Base64 signing key or a raw signing-key file."
            }
            $key = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($key))
            $decodedKey = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
          }

          if ($decodedKey -notmatch '^untrusted comment:') {
            throw "TAURI_SIGNING_PRIVATE_KEY is not an outer Base64 updater signing key. Do not use the public key from tauri.conf.json."
          }

          "TAURI_SIGNING_PRIVATE_KEY=$key" | Add-Content -Path $env:GITHUB_ENV

      # Do not replace this with `bun tauri build`: the public release wrapper builds
      # commander-svc, stages it as a Tauri resource, and forces NSIS so its
      # service install/update/uninstall hooks are compiled into the setup. It
      # deliberately does not require the separate private Pro source checkout.
      - name: Build signed Free NSIS setup
        env:
          RUST_MIN_STACK: "16777216"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build:free:release-installer

      # This is an artifact-level gate, not a source-contract check.  It
      # proves the installer contains the staged service by actually running
      # its NSIS lifecycle: install, create/configure/start WinCommanderSvc,
      # then uninstall and remove it again on the clean hosted runner.
      - name: Verify Free setup installs and removes WinCommanderSvc
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.Substring(1)
          $setups = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "WinCommander*${version}*_x64-setup.exe" -File | Where-Object { $_.Name -notlike "*.sig*" })
          if ($setups.Count -ne 1) {
            throw "Expected exactly one NSIS setup for v$version; found $($setups.Count)."
          }

          $setup = $setups[0].FullName
          $diagnosticLog = Join-Path $env:ProgramFiles "WinCommander\installer-lifecycle.log"
          Remove-Item -LiteralPath $diagnosticLog -Force -ErrorAction SilentlyContinue
          # The Free setup is per-machine and installs an SCM service. Hosted
          # runners have a split administrator token, so launch it elevated.
          $setupProcess = Start-Process -FilePath $setup -ArgumentList "/S" -Verb RunAs -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $diagnosticLog -PathType Leaf) {
              Write-Host "NSIS lifecycle diagnostic:"
              Get-Content -LiteralPath $diagnosticLog -Raw | Write-Host
              Remove-Item -LiteralPath $diagnosticLog -Force
            }
            throw "The NSIS setup failed with exit code $($setupProcess.ExitCode)."
          }

          $servicePath = Join-Path $env:ProgramFiles "WinCommander\wincommander-svc.exe"
          if (-not (Test-Path -LiteralPath $servicePath -PathType Leaf)) {
            throw "The NSIS setup did not install wincommander-svc.exe at $servicePath."
          }
          $service = Get-CimInstance Win32_Service -Filter "Name='WinCommanderSvc'" -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            throw "The NSIS setup did not create WinCommanderSvc."
          }
          $serviceRegistry = Get-ItemProperty -LiteralPath "Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\WinCommanderSvc" -ErrorAction Stop
          if ($serviceRegistry.Start -ne 2 -or $service.PathName -notmatch [Regex]::Escape($servicePath)) {
            throw "WinCommanderSvc configuration mismatch (Start=$($serviceRegistry.Start), CIM StartMode=$($service.StartMode), PathName=$($service.PathName))."
          }
          $running = Get-Service -Name WinCommanderSvc -ErrorAction Stop
          $running.WaitForStatus("Running", [TimeSpan]::FromSeconds(30))
          $running.Refresh()
          if ($running.Status -ne "Running") {
            throw "WinCommanderSvc was installed but is not running (state: $($running.Status))."
          }

          $uninstaller = Join-Path $env:ProgramFiles "WinCommander\uninstall.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "The NSIS setup did not create its uninstaller at $uninstaller."
          }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Verb RunAs -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $diagnosticLog -PathType Leaf) {
              Write-Host "NSIS lifecycle diagnostic:"
              Get-Content -LiteralPath $diagnosticLog -Raw | Write-Host
              Remove-Item -LiteralPath $diagnosticLog -Force
            }
            throw "The NSIS uninstaller failed with exit code $($uninstallProcess.ExitCode)."
          }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $remainingService = Get-CimInstance Win32_Service -Filter "Name='WinCommanderSvc'" -ErrorAction SilentlyContinue
            if ($null -eq $remainingService) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if ($null -ne $remainingService) {
            throw "The NSIS uninstaller did not remove WinCommanderSvc."
          }
          if (Test-Path -LiteralPath $servicePath) {
            throw "The NSIS uninstaller did not remove wincommander-svc.exe."
          }
          Remove-Item -LiteralPath $diagnosticLog -Force -ErrorAction SilentlyContinue

      - name: Verify bundled shared media
        shell: pwsh
        run: |
          $bundleAssets = "dist/assets"
          $requiredPatterns = @(
            "synology-chat-*.png",
            "rsa-logo-*.svg",
            "nsa-prism-slide-*.png",
            "usb-decoy-hub-*.png",
            "pro-nobg-*.png",
            "max-nobg-*.png",
            "panic-button-*.webm",
            "panic-button-*.mp4",
            "watering-plant-*.webm",
            "watering-plant-*.mp4",
            "phone-click-*.webm",
            "phone-click-*.mp4",
            "Scrub-*.gif",
            "Extention-*.png",
            "wc-lockdown-*.mp4",
            "firefox-*.svg",
            "android-*.png",
            "lightburn-*.png",
            "coreldraw-*.png",
            "autodesk-*.png"
          )

          foreach ($pattern in $requiredPatterns) {
            if (-not (Get-ChildItem -Path $bundleAssets -Filter $pattern -File -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "The production bundle is missing expected shared media: $pattern"
            }
          }

      - name: Reject unexpected Free bundle media
        shell: pwsh
        run: |
          $bundleAssets = "dist/assets"
          $forbidden = @(Get-ChildItem -Path $bundleAssets -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".zip") -or $_.Name -match "theron" })
          if ($forbidden.Count -gt 0) {
            $paths = $forbidden.FullName -join ", "
            throw "The Free bundle contains forbidden media: $paths"
          }

          $mediaExtensions = @(".avif", ".gif", ".ico", ".jpeg", ".jpg", ".mp4", ".png", ".svg", ".webm", ".webp")
          $mediaBytes = (Get-ChildItem -Path $bundleAssets -Recurse -File |
            Where-Object { $_.Extension -in $mediaExtensions } |
            Measure-Object -Property Length -Sum).Sum
          if ($mediaBytes -gt 64MB) {
            throw "Free bundle media is $([math]::Round($mediaBytes / 1MB, 2)) MiB; limit is 64 MiB."
          }

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: wincommander-free.sbom.cdx.json

      - name: Prepare signed release assets
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          UPDATE_DOMAIN: ${{ secrets.CF_UPDATE_DOMAIN }}
        run: |
          if (-not $env:RELEASE_TAG.StartsWith("v")) {
            throw "Release tags must start with 'v': $env:RELEASE_TAG"
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $config = Get-Content "src-tauri/commander-free/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($config.version -ne $version) {
            throw "Tag $env:RELEASE_TAG does not match Tauri version $($config.version)."
          }

          $setups = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "WinCommander*${version}*_x64-setup.exe" -File | Where-Object { $_.Name -notlike "*.sig*" })
          if ($setups.Count -ne 1) {
            throw "Expected exactly one NSIS setup for v$version; found $($setups.Count)."
          }
          $setup = $setups[0]
          $signaturePath = "$($setup.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Tauri updater signature not found: $signaturePath"
          }

          $signature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Tauri updater signature is empty."
          }
          $signatureText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($signature))
          if ($signatureText -notmatch [Regex]::Escape($setup.Name)) {
            throw "The updater signature does not name $($setup.Name)."
          }

          $assetDirectory = Join-Path $env:RUNNER_TEMP "wincommander-release-assets"
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
          $manifestPath = Join-Path $assetDirectory "latest.json"
          $checksumPath = Join-Path $assetDirectory "SHA256SUMS.txt"
          $assetName = [Uri]::EscapeDataString($setup.Name)
          $updateDomain = $env:UPDATE_DOMAIN.Trim().TrimEnd('/')
          if ([string]::IsNullOrWhiteSpace($updateDomain)) {
            throw "The release environment does not provide CF_UPDATE_DOMAIN."
          }
          if ($updateDomain -notmatch '^https?://') {
            $updateDomain = "https://$updateDomain"
          }
          $manifest = @{
            version = $version
            notes = "WinCommander Free v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "$updateDomain/free/v$version/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText($manifestPath, $manifest, [Text.UTF8Encoding]::new($false))

          $sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($checksumPath, "$sha256 *$($setup.Name)`n", [Text.UTF8Encoding]::new($false))

          "SETUP_PATH=$($setup.FullName)" | Add-Content -Path $env:GITHUB_ENV
          "SETUP_SIGNATURE_PATH=$signaturePath" | Add-Content -Path $env:GITHUB_ENV
          "LATEST_JSON_PATH=$manifestPath" | Add-Content -Path $env:GITHUB_ENV
          "CHECKSUM_PATH=$checksumPath" | Add-Content -Path $env:GITHUB_ENV

      - name: Attest signed Free setup provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.SETUP_PATH }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wincommander-free-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.SETUP_PATH }}
            ${{ env.SETUP_SIGNATURE_PATH }}
            ${{ env.LATEST_JSON_PATH }}
            ${{ env.CHECKSUM_PATH }}
            wincommander-free.sbom.cdx.json
          if-no-files-found: error

      # Upload immutable artifacts before the mutable latest.json pointer. A
      # client that sees a new manifest can therefore always fetch its setup and
      # minisign sidecar from the same R2 release.
      - name: Publish signed Free release to R2
        shell: pwsh
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.CF_R2_API }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_KEY }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
          RCLONE_CONFIG_R2_REGION: auto
        run: |
          $ErrorActionPreference = "Stop"
          $rcloneZip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          $rcloneDir = Join-Path $env:RUNNER_TEMP "rclone"
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile $rcloneZip
          Expand-Archive -Path $rcloneZip -DestinationPath $rcloneDir -Force
          $rclone = (Get-ChildItem $rcloneDir -Filter "rclone.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $rclone) { throw "rclone.exe was not found after download." }

          $remote = "r2:windows"
          $version = $env:RELEASE_TAG.Substring(1)
          $setupName = Split-Path -Leaf $env:SETUP_PATH
          & $rclone copyto $env:SETUP_PATH "$remote/free/v$version/$setupName" "--s3-no-check-bucket"
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the versioned setup to R2." }
          & $rclone copyto $env:SETUP_SIGNATURE_PATH "$remote/free/v$version/$setupName.sig" "--s3-no-check-bucket"
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the versioned setup signature to R2." }
          & $rclone copyto $env:CHECKSUM_PATH "$remote/free/v$version/SHA256SUMS.txt" "--s3-no-check-bucket"
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the versioned checksum to R2." }
          & $rclone copyto "wincommander-free.sbom.cdx.json" "$remote/free/v$version/wincommander-free.sbom.cdx.json" "--s3-no-check-bucket"
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the versioned SBOM to R2." }
          & $rclone copyto $env:SETUP_PATH "$remote/free/latest.exe" "--ignore-times" "--s3-no-check-bucket"
          if ($LASTEXITCODE -ne 0) { throw "Could not promote the latest setup to R2." }
          & $rclone copyto $env:LATEST_JSON_PATH "$remote/free/latest.json" "--ignore-times" "--s3-no-check-bucket"
          if ($LASTEXITCODE -ne 0) { throw "Could not publish free/latest.json to R2." }

      # GitHub Releases remain the public release archive. The installed app
      # does not read this release or download its updater from GitHub.
      - name: Publish GitHub Release archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $releaseAssets = @(
            $env:SETUP_PATH,
            $env:SETUP_SIGNATURE_PATH,
            $env:LATEST_JSON_PATH,
            $env:CHECKSUM_PATH,
            "wincommander-free.sbom.cdx.json"
          )
          $notes = "Automated Free NSIS setup release. Verify provenance with: gh attestation verify `"<installer>-setup.exe`" -R ${{ github.repository }}"

          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @releaseAssets --clobber
            exit $LASTEXITCODE
          }

          $releaseArgs = @("release", "create", $env:RELEASE_TAG, "--title", $env:RELEASE_TAG, "--notes", $notes)
          if ($env:RELEASE_TAG.Contains("-")) {
            $releaseArgs += "--prerelease"
          }
          $releaseArgs += $releaseAssets
          gh @releaseArgs
