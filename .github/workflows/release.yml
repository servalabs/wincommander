name: release

# Builds the AGPL Free binary from public source and publishes verifiable
# build metadata for it: a SLSA build-provenance attestation (Sigstore /
# Rekor-backed), a CycloneDX SBOM, and a cargo-auditable dependency manifest
# embedded in the binary. Anyone can then confirm a Free binary was built from
# the exact public commit on GitHub, and scan its dependency tree, WITHOUT
# cloning the repo:
#
#   gh attestation verify wincommander-free.exe -R servalabs/wincommander
#   cargo audit bin wincommander-free.exe
#
# NOTE: this workflow does NOT sign or publish the end-user MSI. The
# signed-installer release + R2 upload pipeline lives in the private
# commander-pro repo (see tools/release.ps1). This is the public, secret-free
# verifiability layer for the Free build only.
#
# The local commander-pro release script publishes the signed MSI and R2
# manifests first. Its version tag then starts this public, secret-free
# attestation build for the same source revision.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Keep duplicate runs for one version tag serialized. The local commander-pro
# script remains the only authority for updater signing and R2 publication.
concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create/attach a GitHub Release on tag builds
  id-token: write # OIDC for keyless Sigstore signing
  attestations: write # write the build-provenance attestation

jobs:
  build-free-attested:
    name: Build + attest Free binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      # Same build sequence as the green `strings-grep-free` invariants job:
      # install deps, encrypt the PowerShell modules, build the frontend bundle
      # (Tauri embeds it at build time), then build the Free binary.
      - name: Install deps + build frontend
        run: |
          bun install --frozen-lockfile
          bun run encrypt-backend
          bun x vite build

      # cargo-auditable embeds the exact dependency tree into the binary's
      # .dep-v0 section so a researcher can run `cargo audit bin <exe>`.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked

      - name: Build Free binary (release, auditable)
        working-directory: src-tauri
        env:
          # rustc on Windows occasionally blows its default 8 MB thread stack
          # compiling tauri proc-macros — same workaround as the dev/CI builds.
          RUST_MIN_STACK: "16777216"
        run: cargo auditable build --release -p commander-free

      # CycloneDX SBOM over the whole repo (Rust + JS dependency graph).
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: wincommander-free.sbom.cdx.json

      # SLSA build provenance for the built binary (Sigstore keyless + Rekor).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: src-tauri/target/release/wincommander-free.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wincommander-free-${{ github.ref_name }}
          path: |
            src-tauri/target/release/wincommander-free.exe
            wincommander-free.sbom.cdx.json
          if-no-files-found: error

      # On a tag push, also attach the binary + SBOM to the GitHub Release
      # (created if absent). Uses the preinstalled gh CLI — no extra action.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" 2>$null `
            || gh release create "${{ github.ref_name }}" `
                 --title "${{ github.ref_name }}" `
                 --notes "Automated build. Verify provenance with: gh attestation verify wincommander-free.exe -R ${{ github.repository }}"
          gh release upload "${{ github.ref_name }}" `
            src-tauri/target/release/wincommander-free.exe `
            wincommander-free.sbom.cdx.json --clobber
