name: Settings split disposable Windows fixture
on:
  push:
    branches: [codex/settings-modular-quality-20261106]
permissions:
  contents: read
jobs:
  settings-split:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run encrypt-backend
      - name: Compile and test generation split
        shell: pwsh
        working-directory: src-tauri
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $filters = @('settings_generation_cutover::tests::', 'settings_rotation_trial::tests::', 'settings_rotation_trial::source_snapshot::tests::')
          foreach ($filter in $filters) {
            $output = & cargo test --locked -p commander-free --lib --features experimental-settings-generation $filter -- --test-threads=1 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0 -or -not (($output | Out-String) -match 'running [1-9][0-9]* tests?')) { throw "Settings fixture failed: $filter" }
          }
