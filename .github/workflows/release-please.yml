name: prepare release

# Conventional commits merged into main create or update one release PR. When
# that protected PR is merged, Release Please creates the vX.Y.Z tag; the tag
# then starts release.yml, which is the only workflow allowed to build/sign the
# public Free MSI.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare versioned release PR
    runs-on: ubuntu-latest
    steps:
      - name: Create release PR or tag merged release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A fine-grained token is required: tags created with GITHUB_TOKEN do
          # not start the separate signed-MSI workflow.
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # release.yml creates the public release only after the signed MSI,
          # checksum, SBOM, and provenance are ready to upload.
          skip-github-release: true
