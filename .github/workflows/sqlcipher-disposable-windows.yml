name: Experimental SQLCipher disposable Windows checks
on:
  push:
    branches: [codex/sqlcipher-windows-ci-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run encrypt-backend
      - name: Verify Windows SQLCipher build tools
        shell: pwsh
        run: |
          Get-Command perl -ErrorAction Stop
          Get-Command nasm -ErrorAction Stop
      - name: Test actual disposable scratch and plaintext optimizer paths
        working-directory: src-tauri
        shell: pwsh
        run: |
          $tests = @(
            'duplicate_finder::tests::encrypted_scan_database_remains_private_after_bulk_commit',
            'duplicate_finder::tests::scan_scratch_does_not_expose_paths_on_disk',
            'routine_cleaner::mutations::tests::vacuum_preserves_existing_plaintext_database_with_wal_and_without'
          )
          foreach ($test in $tests) {
            $output = & cargo test --locked -p commander-free --lib $test -- --exact --nocapture 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { exit $code }
            if (($output -join "`n") -notmatch 'running 1 test') { throw "Required test did not run: $test" }
          }
