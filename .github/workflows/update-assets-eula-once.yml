name: Stage verified EULA v1.11 update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-assets-eula-once.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - name: Advance assets to approved EULA v1.11
        run: |
          git -C assets fetch origin 097145adf03561c3826b6481b7beb92731c0b81f
          git -C assets checkout 097145adf03561c3826b6481b7beb92731c0b81f
      - name: Generate and verify installer licence
        run: |
          bun run gen:eula-rtf
          bun run gen:eula-rtf --check
          grep -F "Version 1.11" src-tauri/commander-free/nsis/LICENSE.rtf
          grep -F "not exceeding INR 2,00,00,000" src-tauri/commander-free/nsis/LICENSE.rtf
          ! grep -F "requires its resellers to register each end customer" src-tauri/commander-free/nsis/LICENSE.rtf
          git diff --check
      - name: Commit exact generated output to staging branch
        run: |
          rm .github/workflows/update-assets-eula-once.yml
          git config user.name "servalabs-legal-bot"
          git config user.email "166895751+servalabs@users.noreply.github.com"
          git add -A
          git commit -m "chore: update assets and installer EULA to v1.11"
          git push --force origin HEAD:refs/heads/automation/eula-v1.11-assets
