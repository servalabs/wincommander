name: Paired synthetic lab packaging
on:
  push:
    branches: [codex/settings-migration-windows-ci-20261106]
    paths: ['.github/workflows/paired-synthetic-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: 'false'
      WINCMD_APP_DIR: WinCommander
      WINCMD_FENCED_PRO_APP_DIR: WinCommander
      WINCMD_FENCED_PRO_PROTOCOL: wincommander-search-fence-v1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Prepare public synthetic Pro input
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'synthetic-pro.exe'
          Copy-Item -LiteralPath $env:ComSpec -Destination $fake
          "WINCMD_FENCED_PRO_SHA256=$((Get-FileHash -LiteralPath $fake -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
      - name: Build guarded service with synthetic Pro hash
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml -p commander-svc --features experimental-search-broker-fence
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic guarded service build failed.' }
          $service = (Resolve-Path 'src-tauri/target/release/wincommander-svc.exe').Path
          "WINCMD_FENCED_SERVICE_PATH=$service" >> $env:GITHUB_ENV
          "WINCMD_FENCED_SERVICE_SHA256=$((Get-FileHash -LiteralPath $service -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
      - name: Prepare frontend and disable updater signing for disposable fixture
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency install failed.' }
          $path = 'src-tauri/commander-free/tauri.conf.json'
          $config = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 -LiteralPath $path
      - name: Build disposable paired lab installer
        shell: pwsh
        run: |
          bun run tools/build-tauri-release.ts --experimental-paired-search-lab
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic paired installer build failed.' }
      - name: Extract and compare bundled service bytes
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -File 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one synthetic NSIS installer.' }
          $extract = Join-Path $env:RUNNER_TEMP 'paired-lab-extracted'
          if (Test-Path -LiteralPath $extract) { throw 'Extraction path already exists.' }
          & 7z x $installers[0].FullName "-o$extract" -y
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic installer extraction failed.' }
          $services = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'wincommander-svc.exe')
          if ($services.Count -ne 1 -or $services[0].Directory.Name -ine 'resources') { throw 'Expected one service under resources.' }
          $hash = (Get-FileHash -LiteralPath $services[0].FullName -Algorithm SHA256).Hash
          if ($hash -ine $env:WINCMD_FENCED_SERVICE_SHA256) { throw 'Extracted service hash does not match paired build input.' }
          Write-Host 'Disposable installer contains the expected synthetic guarded service.'
