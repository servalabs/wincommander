[package]
name = "settings-migration-native-fixture"
version = "0.1.0"
edition = "2021"
[features]
experimental-settings-generation = []
[dependencies]
hex = "0.4"
windows-sys = { version="0.61", features=["Win32_Foundation","Win32_Security","Win32_Security_Cryptography","Win32_Security_Authorization","Win32_Storage_FileSystem","Win32_System_Threading","Win32_System_Diagnostics_ToolHelp","Win32_System_Services","Win32_System_Com","Win32_UI_Shell"] }
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.22"
rand = {version="0.8",default-features=false,features=["std","std_rng"]}
serde = {version="1",features=["derive"]}
serde_json = "1"
zeroize = {version="1",features=["alloc"]}
tempfile = "3"
sha2 = "0.10"
argon2_legacy = { package="argon2", version="0.5" }
